name: '🔨 Manual Build'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      aioncore_run_id:
        description: 'Optional AionCore Manual Build workflow run id to bundle instead of the pinned release'
        required: false
        type: string
        default: ''
      aioncore_repo:
        description: 'AionCore repository owner/name for aioncore_run_id artifacts'
        required: false
        type: string
        default: 'iOfficeAI/AionCore'
      promote_run_id:
        description: 'Optional completed Manual Build run id to promote instead of building'
        required: false
        type: string
        default: ''
      promote_artifact_name:
        description: 'Artifact name from promote_run_id'
        required: false
        type: string
        default: ''
      promote_install_artifact_name:
        description: 'Optional install-web.sh artifact from promote_run_id'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Release tag used when promoting an existing run'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title used when promoting an existing run'
        required: false
        type: string
        default: ''
      release_prerelease:
        description: 'Mark the promoted release as a prerelease'
        required: false
        type: boolean
        default: true

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    if: inputs.promote_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    if: inputs.promote_run_id == ''
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      aioncore_run_id: ${{ inputs.aioncore_run_id }}
      aioncore_repo: ${{ inputs.aioncore_repo }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit

  promote-release:
    name: Promote Build Artifact to Release
    if: inputs.promote_run_id != ''
    runs-on: ubuntu-latest

    steps:
      - name: Validate promotion inputs and source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
          PROMOTE_ARTIFACT_NAME: ${{ inputs.promote_artifact_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PROMOTE_ARTIFACT_NAME" || -z "$RELEASE_TAG" ]]; then
            echo "::error::promote_artifact_name and release_tag are required in promotion mode"
            exit 1
          fi

          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTE_RUN_ID}")
          RUN_CONCLUSION=$(jq -r '.conclusion' <<<"$RUN_JSON")
          RUN_HEAD_SHA=$(jq -r '.head_sha' <<<"$RUN_JSON")
          RUN_HEAD_BRANCH=$(jq -r '.head_branch' <<<"$RUN_JSON")

          if [[ "$RUN_CONCLUSION" != "success" ]]; then
            echo "::error::Source run ${PROMOTE_RUN_ID} conclusion is ${RUN_CONCLUSION}, expected success"
            exit 1
          fi

          if [[ "$RUN_HEAD_BRANCH" != "$SOURCE_BRANCH" ]]; then
            echo "::error::Source run branch is ${RUN_HEAD_BRANCH}, expected ${SOURCE_BRANCH}"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists"
            exit 1
          fi

          echo "head_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.promote_artifact_name }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promote_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web install script artifact
        if: inputs.promote_install_artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.promote_install_artifact_name }}
          path: install-script-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promote_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release-specific web install script
        if: inputs.promote_install_artifact_name != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          TARBALL=$(find release-assets -maxdepth 1 -type f -name 'aionui-web-*.tar.gz' -print -quit)
          SOURCE_SCRIPT=$(find install-script-source -type f -name 'install-web.sh' -print -quit)
          if [[ -z "$TARBALL" || -z "$SOURCE_SCRIPT" ]]; then
            echo "::error::Web promotion requires an aionui-web tarball and install-web.sh"
            exit 1
          fi

          TARBALL_NAME=$(basename "$TARBALL")
          if [[ ! "$TARBALL_NAME" =~ ^aionui-web-(.+)-(darwin|linux|win)-(arm64|x86_64)\.tar\.gz$ ]]; then
            echo "::error::Unexpected web tarball name: ${TARBALL_NAME}"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          PLATFORM="${BASH_REMATCH[2]}"
          ARCH="${BASH_REMATCH[3]}"
          TARGET_SCRIPT="release-assets/install-aionui-web-${VERSION}-${PLATFORM}-${ARCH}.sh"

          sed \
            -e "s|^VERSION=.*$|VERSION=\"\${VERSION:-${VERSION}}\"|" \
            -e "s|^MIRROR=.*$|MIRROR=\"\${MIRROR:-https://github.com/${GITHUB_REPOSITORY}/releases/download}\"|" \
            -e "s|\${MIRROR}/v\${VERSION}/\${TARBALL_NAME}|\${MIRROR}/${RELEASE_TAG}/\${TARBALL_NAME}|g" \
            -e "s|\${MIRROR}/v\${VERSION}/\${CHECKSUM_NAME}|\${MIRROR}/${RELEASE_TAG}/\${CHECKSUM_NAME}|g" \
            "$SOURCE_SCRIPT" > "$TARGET_SCRIPT"
          chmod +x "$TARGET_SCRIPT"

          grep -F "VERSION=\"\${VERSION:-${VERSION}}\"" "$TARGET_SCRIPT"
          grep -F "${RELEASE_TAG}/\${TARBALL_NAME}" "$TARGET_SCRIPT"
          grep -F "github.com/${GITHUB_REPOSITORY}/releases/download" "$TARGET_SCRIPT"

      - name: Validate release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ASSETS < <(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.zip' -o -name '*.tar.gz' \) \
              -print0
          )

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "::error::Artifact does not contain a supported release asset"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi

          (
            cd release-assets
            printf '%s\0' "${ASSETS[@]#release-assets/}" | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Write release notes
        env:
          SOURCE_RUN_ID: ${{ inputs.promote_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Manual build promoted from GitHub Actions.

          - Source branch: \`${{ inputs.branch }}\`
          - Source commit: \`${SOURCE_SHA}\`
          - Build run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}
          - Artifact: \`${{ inputs.promote_artifact_name }}\`

          SHA-256 checksums are attached as \`SHA256SUMS.txt\`.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ steps.source.outputs.head_sha }}
          name: ${{ inputs.release_title || inputs.release_tag }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ inputs.release_prerelease }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
